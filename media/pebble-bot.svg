<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -20 240 295" width="240" height="295" fill="none" id="mascot-pip-drone" aria-labelledby="pip-title pip-desc"><title id="pip-title">Pip Drone Mascot</title><desc id="pip-desc">Un piccolo drone fluttuante color crema e terracotta con visore digitale, mani a levitazione magnetica, propulsore inferiore e antenna ricetrasmittente.</desc><defs><linearGradient id="pip-chassis-grad" x1="95" y1="45" x2="145" y2="216" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#fffefb"/><stop offset="45%" stop-color="#f7f1e6"/><stop offset="82%" stop-color="#e8dac2"/><stop offset="100%" stop-color="#d5c1a1"/></linearGradient><linearGradient id="pip-visor-bezel-grad" x1="120" y1="82" x2="120" y2="138" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#cbb799"/><stop offset="100%" stop-color="#fffefb"/></linearGradient><linearGradient id="pip-visor-grad" x1="120" y1="84" x2="120" y2="136" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#33251a"/><stop offset="38%" stop-color="#1b130c"/><stop offset="100%" stop-color="#0b0704"/></linearGradient><linearGradient id="pip-visor-sheen-grad" x1="75" y1="86" x2="155" y2="130" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#fffefb" stop-opacity=".25"/><stop offset="45%" stop-color="#fffefb" stop-opacity=".05"/><stop offset="100%" stop-color="#fffefb" stop-opacity="0"/></linearGradient><linearGradient id="pip-baton-glow-grad" x1="120" y1="152" x2="120" y2="166" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#f79b6b"/><stop offset="45%" stop-color="#e27a45"/><stop offset="85%" stop-color="#b84f22"/><stop offset="100%" stop-color="#8f3612"/></linearGradient><linearGradient id="pip-baton-window-grad" x1="120" y1="152" x2="120" y2="166" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#fffefb"/><stop offset="65%" stop-color="#f7f1e6"/><stop offset="100%" stop-color="#dfd0b8"/></linearGradient><linearGradient id="pip-antenna-stalk-grad" x1="118" y1="18" x2="122" y2="44" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#e27a45"/><stop offset="100%" stop-color="#9b3f18"/></linearGradient><radialGradient id="pip-chassis-bounce-grad" cx="50%" cy="88%" r="55%"><stop offset="0%" stop-color="#e27a45" stop-opacity=".22"/><stop offset="65%" stop-color="#c25a2c" stop-opacity=".05"/><stop offset="100%" stop-color="#c25a2c" stop-opacity="0"/></radialGradient><radialGradient id="pip-terra-pod-grad" cx="35%" cy="30%" r="70%"><stop offset="0%" stop-color="#f69d6e"/><stop offset="38%" stop-color="#e27a45"/><stop offset="78%" stop-color="#c25a2c"/><stop offset="100%" stop-color="#873311"/></radialGradient><radialGradient id="pip-beacon-grad" cx="38%" cy="35%" r="65%"><stop offset="0%" stop-color="#fffefb"/><stop offset="40%" stop-color="#f5c56c"/><stop offset="80%" stop-color="#d9a14a"/><stop offset="100%" stop-color="#a86d1e"/></radialGradient><radialGradient id="pip-shadow-grad" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#1b130c" stop-opacity=".32"/><stop offset="55%" stop-color="#1b130c" stop-opacity=".12"/><stop offset="100%" stop-color="#1b130c" stop-opacity="0"/></radialGradient><clipPath id="pip-chassis-clip"><path d="M120 48c-48 0-70 34-70 86s26 82 70 82 70-30 70-82-22-86-70-86"/></clipPath><clipPath id="pip-visor-clip"><rect x="68" y="86" width="104" height="48" rx="24"/></clipPath><clipPath id="pip-baton-clip"><rect x="88" y="152" width="64" height="14" rx="7"/></clipPath><filter id="pip-led-glow" x="-35%" y="-35%" width="170%" height="170%" color-interpolation-filters="sRGB"><feGaussianBlur in="SourceGraphic" stdDeviation="2.2" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="pip-soft-drop" x="-20%" y="-20%" width="140%" height="150%" color-interpolation-filters="sRGB"><feDropShadow dx="0" dy="5" stdDeviation="3.5" flood-color="#1b130c" flood-opacity=".14"/></filter></defs><style>@keyframes pipLevitate{0%,to{transform:translateY(0)}50%{transform:translateY(-7.5px)}}@keyframes pipShadowPulse{0%,to{transform:scale(1);opacity:1}50%{transform:scale(.86);opacity:.55}}@keyframes pipLeftHandHover{0%,to{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-9px) rotate(-4deg)}}@keyframes pipRightHandHover{0%,to{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-9px) rotate(4deg)}}@keyframes pipBatonFloat{0%,to{transform:translateY(0) scale(1)}50%{transform:translateY(-7px) scale(1.025)}}@keyframes pipDigitalBlink{0%,45%,49%,92%,96%,to{transform:scaleY(1)}47%,94%{transform:scaleY(.06)}}@keyframes pipAntennaWiggle{0%,to{transform:rotate(12deg)}50%{transform:rotate(5.5deg)}}@keyframes pipBroadcastWave{0%{transform:scale(0.8);opacity:.9}70%{opacity:.35}to{transform:scale(1.5);opacity:0}}@keyframes fluxFlow{0%{stroke-dashoffset:0}to{stroke-dashoffset:-16}}@keyframes visorSheen{0%,to{opacity:.22;transform:translateX(0)}50%{opacity:.48;transform:translateX(1.5px)}}@keyframes emitterSpin{0%{transform:rotate(0deg)}to{transform:rotate(360deg)}}@keyframes telemetryPulse{0%,to{opacity:.4;transform:scale(.9)}50%{opacity:1;transform:scale(1.15)}}#mascot-pip-drone *{transform-box:view-box}@media (prefers-reduced-motion:no-preference){#pip__floating-core{animation:pipLevitate 3.4s cubic-bezier(.42,0,.58,1) infinite}#pip__shadow{transform-origin:120px 246px;animation:pipShadowPulse 3.4s cubic-bezier(.42,0,.58,1) infinite}#pip__hand-left-assembly{transform-origin:34px 148px;animation:pipLeftHandHover 3.4s cubic-bezier(.42,0,.58,1) infinite}#pip__hand-right-assembly{transform-origin:206px 148px;animation:pipRightHandHover 3.4s cubic-bezier(.42,0,.58,1) infinite}#pip__data-baton-assembly{transform-origin:120px 159px;animation:pipBatonFloat 3.4s cubic-bezier(.42,0,.58,1) infinite}#pip__eyes-led-display{transform-origin:120px 112px;animation:pipDigitalBlink 4.6s infinite}#pip__antenna-assembly{transform-origin:120px 45px;animation:pipAntennaWiggle 3.4s ease-in-out infinite}#pip__antenna-wave-inner,#pip__antenna-wave-outer{transform-origin:120px 14px;animation:pipBroadcastWave 2.2s ease-out infinite}#pip__antenna-wave-outer{animation-delay:1.1s}#pip__magnetic-flux-left,#pip__magnetic-flux-right{stroke-dasharray:4 4;animation:fluxFlow 1.2s linear infinite}#pip__visor-glare-reflection{animation:visorSheen 5s ease-in-out infinite}#pip__hand-left-emitter-ring{transform-origin:34px 148px;animation:emitterSpin 10s linear infinite}#pip__hand-right-emitter-ring{transform-origin:206px 148px;animation:emitterSpin 10s linear infinite reverse}#pip__baton-telemetry-glow{transform-origin:120px 159px;animation:telemetryPulse 1.8s ease-in-out infinite}}</style><g id="pip__canvas-group" transform="translate(0 16)"><g id="layer-pip-shadow"><ellipse id="pip__shadow" cx="120" cy="246" rx="56" ry="10.5" fill="url(#pip-shadow-grad)"/></g><g id="layer-pip-rig"><g id="pip__floating-core"><g id="pip__antenna-assembly" transform="rotate(12 120 45)"><ellipse cx="120" cy="48" rx="8" ry="2.5" fill="#d5c1a1"/><path id="pip__antenna-stalk" d="M120 43.5V18" stroke="url(#pip-antenna-stalk-grad)" stroke-width="4" stroke-linecap="round"/><path id="pip__antenna-stalk-highlight" d="M119 41V20" stroke="#f69d6e" stroke-width="1" stroke-linecap="round" opacity=".55"/><rect id="pip__antenna-base-collar" x="113.5" y="43" width="13" height="6.5" rx="3.25" fill="#241b12"/><path id="pip__antenna-collar-highlight" d="M116 45h6.5" stroke="#524030" stroke-width="1.2" stroke-linecap="round"/><path id="pip__antenna-wave-inner" d="M112 5c4.2-4.2 11.8-4.2 16 0" stroke="#e27a45" stroke-width="2" stroke-linecap="round" opacity=".85"/><path id="pip__antenna-wave-outer" d="M108 2c6.4-6.4 17.6-6.4 24 0" stroke="#e27a45" stroke-width="1.8" stroke-linecap="round" opacity=".45"/><circle id="pip__antenna-beacon" cx="120" cy="14" r="5.5" fill="url(#pip-beacon-grad)" filter="url(#pip-led-glow)"/><circle id="pip__antenna-beacon-core" cx="118.5" cy="12.5" r="2" fill="#fffefb"/></g><ellipse id="pip__bottom