</filter></defs><style>@keyframes pipLevitate{0%,to{transform:translateY(0)}50%{transform:translateY(-7.5px)}}@keyframes pipShadowPulse{0%,to{transform:scale(1);opacity:1}50%{transform:scale(.86);opacity:.55}}@keyframes pipLeftHandHover{0%,to{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-9px) rotate(-4deg)}}@keyframes pipRightHandHover{0%,to{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-9px) rotate(4deg)}}@keyframes pipBatonFloat{0%,to{transform:translateY(0) scale(1)}50%{transform:translateY(-7px) scale(1.025)}}@keyframes pipDigitalBlink{0%,45%,49%,92%,96%,to{transform:scaleY(1)}47%,94%{transform:scaleY(.06)}}@keyframes pipAntennaWiggle{0%,to{transform:rotate(12deg)}50%{transform:rotate(5.5deg)}}@keyframes pipBroadcastWave{0%{transform:scale(0.8);opacity:.9}70%{opacity:.35}to{transform:scale(1.5);opacity:0}}@keyframes fluxFlow{0%{stroke-dashoffset:0}to{stroke-dashoffset:-16}}@keyframes visorSheen{0%,to{opacity:.25;transform:translateX(0)}50%{opacity:.55;transform:translateX(1.5px)}}@keyframes emitterSpin{0%{transform:rotate(0deg)}to{transform:rotate(360deg)}}@keyframes telemetryPulse{0%,to{opacity:.45;transform:scale(.9)}50%{opacity:1;transform:scale(1.18)}}#mascot-pip-drone-dark *{transform-box:view-box}@media (prefers-reduced-motion:no-preference){#pip__floating-core{animation:pipLevitate 3.4s cubic-bezier(.42,0,.58,1) infinite}#pip__shadow{transform-origin:120px 246px;animation:pipShadowPulse 3.4s cubic-bezier(.42,0,.58,1) infinite}#pip__hand-left-assembly{transform-origin:34px 148px;animation:pipLeftHandHover 3.4s cubic-bezier(.42,0,.58,1) infinite}#pip__hand-right-assembly{transform-origin:206px 148px;animation:pipRightHandHover 3.4s cubic-bezier(.42,0,.58,1) infinite}#pip__data-baton-assembly{transform-origin:120px 159px;animation:pipBatonFloat 3.4s cubic-bezier(.42,0,.58,1) infinite}#pip__eyes-led-display{transform-origin:120px 112px;animation:pipDigitalBlink 4.6s infinite}#pip__antenna-assembly{transform-origin:120px 45px;animation:pipAntennaWiggle 3.4s ease-in-out infinite}#pip__antenna-wave-inner,#pip__antenna-wave-outer{transform-origin:120px 14px;animation:pipBroadcastWave 2.2s ease-out infinite}#pip__antenna-wave-outer{animation-delay:1.1s}#pip__magnetic-flux-left,#pip__magnetic-flux-right{stroke-dasharray:4 4;animation:fluxFlow 1.2s linear infinite}#pip__visor-glare-reflection{animation:visorSheen 5s ease-in-out infinite}#pip__hand-left-emitter-ring{transform-origin:34px 148px;animation:emitterSpin 10s linear infinite}#pip__hand-right-emitter-ring{transform-origin:206px 148px;animation:emitterSpin 10s linear infinite reverse}#pip__baton-telemetry-glow{transform-origin:120px 159px;animation:telemetryPulse 1.8s ease-in-out infinite}}</style><g id="pip__canvas-group" transform="translate(0 16)"><g id="layer-pip-shadow"><ellipse id="pip__shadow" cx="120" cy="246" rx="56" ry="10.5" fill="url(#pip-shadow-grad-dark)"/></g><g id="layer-pip-rig"><g id="pip__floating-core"><g id="pip__antenna-assembly" transform="rotate(12 120 45)"><ellipse cx="120" cy="48" rx="8" ry="2.5" fill="#8a7256"/><path id="pip__antenna-stalk" d="M120 43.5V18" stroke="url(#pip-antenna-stalk-grad-dark)" stroke-width="4" stroke-linecap="round"/><path id="pip__antenna-stalk-highlight" d="M119 41V20" stroke="#ffb085" stroke-width="1" stroke-linecap="round" opacity=".6"/><rect id="pip__antenna-base-collar" x="113.5" y="43" width="13" height="6.5" rx="3.25" fill="#140d07"/><path id="pip__antenna-collar-highlight" d="M116 45h6.5" stroke="#4a3828" stroke-width="1.2" stroke-linecap="round"/><path id="pip__antenna-wave-inner" d="M112 5c4.2-4.2 11.8-4.2 16 0" stroke="#ff8c52" stroke-width="2" stroke-linecap="round" opacity=".88"/><path id="pip__antenna-wave-outer" d="M108 2c6.4-6.4 17.6-6.4 24 0" stroke="#ff8c52" stroke-width="1.8" stroke-linecap="round" opacity=".48"/><circle id="pip__antenna-beacon" cx="120" cy="14" r="5.5" fill="url(#pip-beacon-grad-dark)" filter="url(#pip-led-glow-dark)"/><circle id="pip__antenna-beacon-