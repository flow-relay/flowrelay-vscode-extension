<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -20 240 295" width="240" height="295" fill="none" id="mascot-pip-drone-dark" aria-labelledby="pip-dark-title pip-dark-desc"><title id="pip-dark-title">Pip Drone Mascot (Dark Mode)</title><desc id="pip-dark-desc">Variante per tema scuro del drone fluttuante Pip, con scocca avorio caldo, contorni ad alto contrasto, propulsore inferiore e LED ad alta luminescenza.</desc><defs><linearGradient id="pip-chassis-grad-dark" x1="95" y1="45" x2="145" y2="216" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#f4e8d4"/><stop offset="45%" stop-color="#e5d7c0"/><stop offset="82%" stop-color="#d2c1a6"/><stop offset="100%" stop-color="#bda88b"/></linearGradient><linearGradient id="pip-visor-bezel-grad-dark" x1="120" y1="82" x2="120" y2="138" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#9e876b"/><stop offset="100%" stop-color="#f4e8d4"/></linearGradient><linearGradient id="pip-visor-grad-dark" x1="120" y1="84" x2="120" y2="136" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#22170e"/><stop offset="38%" stop-color="#120b06"/><stop offset="100%" stop-color="#060301"/></linearGradient><linearGradient id="pip-visor-sheen-grad-dark" x1="75" y1="86" x2="155" y2="130" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#fffefb" stop-opacity=".28"/><stop offset="45%" stop-color="#fffefb" stop-opacity=".06"/><stop offset="100%" stop-color="#fffefb" stop-opacity="0"/></linearGradient><linearGradient id="pip-baton-glow-grad-dark" x1="120" y1="152" x2="120" y2="166" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#ffb085"/><stop offset="45%" stop-color="#ff8c52"/><stop offset="85%" stop-color="#d46531"/><stop offset="100%" stop-color="#a6451a"/></linearGradient><linearGradient id="pip-baton-window-grad-dark" x1="120" y1="152" x2="120" y2="166" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#fffefb"/><stop offset="65%" stop-color="#f4e8d4"/><stop offset="100%" stop-col